<figure class="shot"><svg viewBox="0 0 1200 675" role="img" aria-label="Screenshot placeholder: {{ .Get 0 }}"><rect width="1200" height="675" rx="16" fill="var(--line)"/><rect x="0" y="0" width="1200" height="48" rx="16" fill="var(--muted)" opacity=".25"/><circle cx="32" cy="24" r="8" fill="var(--muted)"/><circle cx="58" cy="24" r="8" fill="var(--muted)"/><circle cx="84" cy="24" r="8" fill="var(--muted)"/><text x="600" y="350" text-anchor="middle" font-size="42" font-family="system-ui,sans-serif" fill="var(--muted)">{{ .Get 0 }}</text><text x="600" y="400" text-anchor="middle" font-size="24" font-family="system-ui,sans-serif" fill="var(--muted)">screenshot placeholder</text></svg>{{ with .Get 1 }}<figcaption>{{ . }}</figcaption>{{ end }}</figure>
