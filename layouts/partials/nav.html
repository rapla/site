<header class="top">
  <a class="brand" href="/"><img src="/images/logo.png" alt="" width="32" height="32"> {{ site.Title }}</a>
  <nav class="menu">
    <input type="checkbox" id="menu-toggle" aria-label="Menu" aria-controls="main-menu">
    <label for="menu-toggle" aria-hidden="true">☰</label>
    <ul id="main-menu">
    {{ range site.Menus.main }}
      {{ $current := or ($.IsMenuCurrent "main" .) (and .Page (ne .Page.Kind "home") ($.IsDescendant .Page)) }}
      <li><a href="{{ .URL }}"{{ with .Params.class }} class="{{ . }}"{{ end }}{{ if $current }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
    {{ end }}
    </ul>
  </nav>
</header>
